name: Desktop Release Rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "native/resource-monitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-desktop-artifact.ts"
      - "scripts/merge-update-manifests.ts"
      - "scripts/release-smoke.ts"
      - "scripts/update-release-package-versions.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "native/resource-monitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-desktop-artifact.ts"
      - "scripts/merge-update-manifests.ts"
      - "scripts/release-smoke.ts"
      - "scripts/update-release-package-versions.ts"

permissions:
  contents: read

jobs:
  rehearse:
    name: Rehearse macOS ${{ matrix.arch }} artifact
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Build unsigned desktop artifact
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --output-dir "release/rehearsal/${{ matrix.arch }}"

      - name: Inspect rehearsed assets
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="release/rehearsal/${{ matrix.arch }}"
          test -n "$(find "$artifact_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find "$artifact_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$(find "$artifact_dir" -maxdepth 1 -type f -name '*.yml' -print -quit)"

      - name: Exercise no-publish release smoke checks
        run: vp run release:smoke
